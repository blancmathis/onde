name: Validate Espace UI (no publication)
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: espace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record reproducible source and validation environment
        run: |
          mkdir -p QA/Espace
          git archive --format=zip -o QA/Espace/source-snapshot.zip HEAD
          git rev-parse HEAD > QA/Espace/checkout-sha.txt
          sw_vers > QA/Espace/environment.txt
          swift --version >> QA/Espace/environment.txt
      - name: Prepare verified instrument bank
        run: bash Tools/prepare_orchestra.sh
      - name: Compile app and run native tests
        run: |
          set -o pipefail
          swift test -c release -j 3 -Xswiftc -DONDE_DESIGN_CAPTURE 2>&1 | tee QA/Espace/swift-tests.log
      - name: Verify and render the fixed Onde menu-bar template
        run: |
          swiftc Sources/OndeApp/OndeStatusIcon.swift Tools/StatusIconCheck.swift -o .build/status-icon-check
          .build/status-icon-check QA/Espace
      - name: Verify live artwork in the real native window
        run: python3 Tools/test_live_artwork.py
      - name: Capture compiled native views in a muted temporary profile
        run: python3 Tools/capture_espace.py
      - name: Package isolated app and verify existing listening behavior
        env:
          ONDE_SKIP_DOWNLOADS: '1'
          ONDE_ORIGINALS_ONLY: '1'
        run: |
          set -o pipefail
          bash Tools/package.sh 2>&1 | tee QA/Espace/package.log
          python3 Tools/listening_integration_test.py dist/Onde.app 2>&1 | tee QA/Espace/listening-integration.log
          python3 Tools/check_english.py 2>&1 | tee QA/Espace/copy-check.log
      - name: Exercise actual native UI actions and protected editing
        run: python3 Tools/native_ui_interaction.py dist/Onde.app
      - name: Verify transport timing and daily totals in muted native profiles
        run: |
          set -o pipefail
          python3 Tools/transport_integration_test.py dist/Onde.app 2>&1 | tee QA/Espace/transport-integration.log
          python3 Tools/daily_activity_integration_test.py dist/Onde.app 2>&1 | tee QA/Espace/daily-integration.log
      - name: Verify update of the packaged app and preserve the private library
        run: |
          ONDE_PACKAGED_APPLICATION="$PWD/dist/Onde.app" swift test -c release -j 3 -Xswiftc -DONDE_DESIGN_CAPTURE --filter UpdatePackagedTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: espace-native-validation
          path: QA/Espace/
          if-no-files-found: warn
