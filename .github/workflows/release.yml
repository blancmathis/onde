name: Build and publish macOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onde-main-release
  cancel-in-progress: true
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Test, compile both architectures and package
        env:
          ONDE_ORIGINALS_ONLY: '1'
          ONDE_SKIP_DOWNLOADS: '1'
        run: bash Tools/release.sh
      - name: Publish only a complete build of current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source dist/release.env
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$CURRENT" != "$GITHUB_SHA" ]]; then
            echo 'A newer main exists; this superseded build will not be published.'
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Onde $VERSION · $ONDE_BUILD" --notes-file dist/release-notes.md \
            dist/Onde-macOS-universal.zip dist/Onde-macOS-universal.zip.sha256 \
            dist/atlas-5min.m4a dist/ostinato-5min.m4a dist/aurore-5min.m4a dist/chambre-5min.m4a
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
