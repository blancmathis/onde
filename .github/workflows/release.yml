name: Build and publish macOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onde-main-release
  cancel-in-progress: true
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Test, compile both architectures and package
        env:
          ONDE_ORIGINALS_ONLY: '1'
          ONDE_SKIP_DOWNLOADS: '1'
        run: bash Tools/release.sh
      - name: Publish only a complete build of current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Tools/publish_release.py
