name: Build and publish macOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onde-main-release
  cancel-in-progress: true
jobs:
  native-ui:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/design-validation.yml
  native-functional:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/full-audit.yml
  native-installation:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/update-validation.yml
  universal-candidate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/community-candidate.yml
  publish:
    needs: [native-ui, native-functional, native-installation, universal-candidate]
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: community-candidate
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: publication-assets
          path: dist
      - name: Verify the tested archive's identity before publication
        run: python3 Tools/verify_release_input.py dist "$GITHUB_SHA" "$(cat VERSION)"
      - name: Publish the tested bytes, without rebuilding or resigning
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Tools/publish_release.py
